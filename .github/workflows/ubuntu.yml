      - name: Get latest CMake and ninja
        uses: lukka/get-cmake@latest
      - name: cmake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJSONCONS_BUILD_TESTS=On 
      - name: build
