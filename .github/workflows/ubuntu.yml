  gcc_build:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7.0.1
    - name: install_gcc
      run: |
           sudo apt update
           sudo apt install gcc-10 g++-10
      shell: bash
    - name: cmake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DJSONCONS_BUILD_TESTS=On
      env:
        CC:   gcc-10
        CXX:  g++-10

    - working-directory: build/
      run: cmake --build . --config ubuntu-26.04

    - working-directory: build/
      run: ctest -C ubuntu-26.04 --output-on-failure

  gcc_build12:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7.0.1
    - name: install_gcc
      run: |
           sudo apt update
           sudo apt install gcc-11 g++-11
      shell: bash
    - name: cmake
      run: cmake -S . -B build -DJSONCONS_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug -DJSONCONS_BUILD_TESTS=On
      env:
        CC:   gcc-11
        CXX:  g++-11

    - working-directory: build/
      run: cmake --build . --config ubuntu-26.04

    - working-directory: build/
      run: ctest -C ubuntu-26.04 --output-on-failure

  gcc_build_no_deprecated:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7.0.1
    - name: install_gcc
      run: |
           sudo apt update
           sudo apt install gcc-10 g++-10
      shell: bash
    - name: cmake
      run: cmake -S . -B build -DCMAKE_CXX_FLAGS="-DJSONCONS_NO_DEPRECATED" -DCMAKE_BUILD_TYPE=Debug -DJSONCONS_BUILD_TESTS=On
      env:
        CC:   gcc-10
        CXX:  g++-10

    - working-directory: build/
      run: cmake --build . --config ubuntu-26.04

    - working-directory: build/
      run: ctest -C ubuntu-26.04 --output-on-failure

  gcc_build11b:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7.0.1
    - name: install_gcc
      run: |
           sudo apt update
           sudo apt install g++-11
      shell: bash
    - name: cmake
      run: cmake -S . -B build -DJSONCONS_SANITIZE=ON -DLLVM_CXX_STD=c++17 -DCMAKE_BUILD_TYPE=Release -DJSONCONS_BUILD_TESTS=On
      env:
        CXX:  g++-11

    - working-directory: build/
      run: cmake --build . --config ubuntu-26.04

    - working-directory: build/
      run: ctest -C ubuntu-26.04 --output-on-failure

